stages:
  validate:
    cmd: python -m credit_default.data.validation
    deps:
      - data/raw/UCI_Credit_Card.csv
      - src/credit_default/data/validation.py
      - src/credit_default/config.py
    outs:
      - reports/validation.json:
          cache: false

  prepare:
    cmd: python -m credit_default.data.make_dataset
    deps:
      - data/raw/UCI_Credit_Card.csv
      - reports/validation.json
      - src/credit_default/data/make_dataset.py
      - src/credit_default/config.py
    params:
      - prepare
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  eda:
    cmd: python -m credit_default.analysis.eda
    deps:
      - data/processed/train.csv
      - src/credit_default/analysis/eda.py
      - src/credit_default/config.py
    outs:
      - reports/figures:
          cache: false

  train:
    cmd: python -m credit_default.models.train
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/credit_default/models
      - src/credit_default/features
      - src/credit_default/config.py
    params:
      - train
    outs:
      - models/model.joblib
      - reports/metrics.json:
          cache: false
      - reports/roc_curve.png:
          cache: false
